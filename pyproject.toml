[tool.uv]
package = false

[project]
name = "urcast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pjmisev", email = "pijus.misevicius@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pymysql>=1.2.3",
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.1.2",
    "pydantic[email]>=2.14.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

[project.scripts]
urcast-api = "urcast_api:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

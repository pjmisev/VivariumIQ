services:
  db:
    image: mariadb:12
    environment:
      MYSQL_DATABASE: vivariumiq_db
      MYSQL_USER: vivariumiq
      MYSQL_PASSWORD: vivariumiq
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - vivariumiq-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uv run fastapi dev main.py --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: mysql+pymysql://vivariumiq:vivariumiq@db:3306/vivariumiq_db
      MQTT_BROKER: mqtt
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  vivariumiq-db-data:

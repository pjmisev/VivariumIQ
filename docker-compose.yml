name: vivariumiq

services:
  db:
    image: mariadb:12
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: vivariumiq_db
      MARIADB_USER: vivariumiq
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-vivariumiq}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - vivariumiq-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://vivariumiq:${MARIADB_PASSWORD:-vivariumiq}@db:3306/vivariumiq_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_TLS: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  vivariumiq-db-data:
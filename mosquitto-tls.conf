# TLS listener for the weather nodes. Copy to /etc/mosquitto/conf.d/urcast-tls.conf
# next to the plain 1883 listener in mosquitto.conf.
#
# Uses the lets encrypt cert for urcast.pjmisev.com, so the Pi nodes can
# verify it with their normal system CA store, no custom cert juggling.
#
# lets encrypt files are root only, so they are copied here first:
#   sudo mkdir /etc/mosquitto/certs
#   sudo cp /etc/letsencrypt/live/urcast.pjmisev.com/fullchain.pem /etc/mosquitto/certs/
#   sudo cp /etc/letsencrypt/live/urcast.pjmisev.com/privkey.pem /etc/mosquitto/certs/
#   sudo chown -R mosquitto:mosquitto /etc/mosquitto/certs
#
# the cert gets replaced every ~90 days by certbot, add a deploy hook under
# /etc/letsencrypt/renewal-hooks/deploy/ to re-copy the files and restart
# mosquitto, otherwise the broker serves the stale cert after renewal.

listener 8883
allow_anonymous true

certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
